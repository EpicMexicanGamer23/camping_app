services:

  trips:
    build:
      context: ./services/trips
    env_file:
      - storage.env
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  gear:
    build:
      context: ./services/gear
    env_file:
      - storage.env
    ports:
      - "8001:8000"
    depends_on:
      database:
        condition: service_healthy

  reminders:
    build:
      context: ./services/reminders
    env_file:
      - storage.env
    ports:
      - "8002:8000"
    depends_on:
      - trips
      - gear

  database:
    image: postgres:17
    env_file:
      - storage.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: