apiVersion: apps/v1
kind: Deployment
metadata:
  name: gear
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gear
  template:
    metadata:
      labels:
        app: gear
    spec:
      containers:
      - name: gear
        image: edvardj/hikeapp-gear:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: postgres-secret
        env:
        - name: DATABASE_HOST
          value: database
        - name: TRIPS_SERVICE_URL
          value: http://trips:8000
        livenessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gear
spec:
  selector:
    app: gear
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gear-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gear
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
