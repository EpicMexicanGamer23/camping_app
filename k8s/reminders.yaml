apiVersion: apps/v1
kind: Deployment
metadata:
  name: reminders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reminders
  template:
    metadata:
      labels:
        app: reminders
    spec:
      containers:
      - name: reminders
        image: edvardj/hikeapp-reminders:latest
        ports:
        - containerPort: 8000
        env:
        - name: TRIPS_SERVICE_URL
          value: http://trips:8000
        - name: GEAR_SERVICE_URL
          value: http://gear:8000
        livenessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: reminders
spec:
  selector:
    app: reminders
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reminders-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reminders
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
